# rowmajor 표 추출(TABLE_EXTRACT=rowmajor)이 모델에 줄 열 배치. ``backend/table_layout.py``가 import 때 읽는다.
# rowmajor는 행마다 값 배열만 받으므로 열 자리가 문서에 인쇄된 열과 같아야 값이 이웃 열로 밀리지 않는다.
# 여기 없는 표나 배치를 정하지 못한 문서는 doctypes 합집합 열 순서로 읽는다.

# 유형 → 표 → 열 배치를 정하는 방법. layout = OCR 머리글 낱말로 양식 번호를 판별해 그 양식의 인쇄 열을 준다,
# header = OCR 머리글 낱말의 x 위치로 인쇄 열 순서를 읽는다.
tables:
  "진료비영수증": {항목내역: layout}
  "세부내역서": {항목내역: header}

# header 방법의 머리글 낱말 표.
header:
  # 표 설명 뒤에 붙이는 문장(열 순서가 머리글 순서임을 알린다).
  note: " 열 순서는 이 문서 표 머리글에 인쇄된 왼쪽→오른쪽 순서다. 값은 머리글 열 아래 칸 그대로 읽고, 빈 칸은 null 로 두며 값을 옆 칸으로 옮기지 않는다. 본인부담은 '본인부담금·일부본인부담' 열, 공단부담은 '공단부담금·보험자부담' 열이다."
  # 머리글 낱말(공백 제거) → 열 개념. 편집거리 1 이내(동률이면 이미 정확히 읽힌 개념을 뺀 쪽)까지 OCR 오독으로 받는다.
  words:
    항목: 항목
    일자: 일자
    날짜: 일자
    입원일자: 일자
    내원일: 일자
    처방일: 일자
    실시일자: 일자
    코드: 코드
    수가코드: 코드
    청구코드: 코드
    표준코드: 코드
    품목코드: 코드
    원내코드: 코드
    EDI코드: 코드
    명칭: 명칭
    수가명: 명칭
    단가: 단가
    금액: 단가
    투여량: 투여량
    용량: 투여량
    수량: 투여량
    총투: 투여량
    투약량: 투여량
    횟수: 횟수
    일수: 일수
    총액: 총액
    구분: 구분
    급비: 구분
    급여구분: 구분
    급여: 급여
    급여액: 급여액
    비급여: 비급여
    본인부담: 본인부담
    본인부담금: 본인부담
    일부본인부담: 본인부담
    공단부담: 공단부담
    공단부담금: 공단부담
    보험자부담금: 공단부담
    전액본인부담: 전액본인부담
    전액본인: 전액본인부담
    선택진료료: 선택진료료
    선택진료: 선택진료료
    선택진료료외: 선택진료료외
    선택진료료이외: 선택진료료외
  # 끝말 → 열 개념. 이 끝말로 끝나는 머리글은 앞말을 못 읽었어도 그 개념이다(처방코드·품목코드·수가코드는 모두 코드 열,
  # '저방일자(시행일자)'는 일자 열).
  endings: {코드: 코드, 일자: 일자}
  # 머리글 아래 둘째 줄에 오는 하위 열(급여·비급여 묶음 아래). 하위 열이 있으면 '급여'는 묶음 제목이라 뺀다.
  subs: [본인부담, 공단부담, 전액본인부담, 선택진료료, 선택진료료외]
  # 개념 → 합집합 열 키. 같은 개념이 여러 번 나오면 차례대로 쓴다(코드 둘 = 원내코드·EDI코드, 금액 둘 = 단가·총액).
  keys:
    항목: [항목]
    일자: [시작일자, 종료일자]
    코드: [원내코드, EDI코드]
    명칭: [EDI명칭]
    단가: [단가, 총액]
    투여량: [투여량]
    횟수: [횟수]
    일수: [일수]
    총액: [총액]
    구분: [급여구분]
    급여: [급여]
    급여액: [급여]
    비급여: [비급여]
    본인부담: [본인부담]
    공단부담: [공단부담]
    전액본인부담: [전액본인부담]
    선택진료료: [선택진료료]
    선택진료료외: [선택진료료외]
  # 머리글 낱말 하나 아래 한 칸에 두 열의 값을 찍는 개념 → 두 열과 값 꼴. 그 칸 본문에 값 꼴을 둘 담은 행이 있으면
  # ('일자' 칸의 '2023.02.22 ~ 2023.03.01', 끝 값은 '~ 03.01'처럼 연도를 줄이기도 한다) 두 열을 함께 묻는다. 아니면 single·keys 대로 한 열이다.
  spans:
    일자: {keys: [시작일자, 종료일자], value: '(?:19|20)\d{2}\s*[./-]?\s*\d{1,2}\s*[./-]?\s*\d{1,2}|(?<=[~∼-])\s*\d{1,2}[./]\d{1,2}(?![\d./])'}
  # 짝 열. 한쪽만 읽었을 때 다른 쪽은 없다는 근거(그 개념 열 수를 셌고 짝 머리글 칸을 모두 머리글 낱말로 읽었다)가 있을 때만 뺀다.
  pairs: [[원내코드, EDI코드], [시작일자, 종료일자], [본인부담, 공단부담]]
  # 낱말 하나뿐일 때 쓰는 열(낱말이나 개념 → 열). 하나뿐인 코드는 EDI코드(doctypes 원내코드 설명), 하나뿐인 금액은 행 금액이라 총액이다
  # (그 열 합이 합계 행이다). 그 열을 다른 개념(오독 포함)이 차지하면 따르지 않는다.
  single: {코드: EDI코드, 금액: 총액}
  # 머리글에서 못 읽으면 서식에 없다고 보고 빼는 열. 나머지 열은 제자리에 읽지 못한 머리글 글자나 넓은 간격이 있을 때만 넣는다.
  # 다만 짝(pairs)이 없다는 근거가 없으면 함께 남긴다 — 짝을 못 읽어 제자리에 넣었거나, 짝 머리글 칸에 읽지 못한 글자가 있을 때.
  optional: [원내코드, 종료일자, 투여량, 급여구분, 급여, 본인부담, 공단부담, 전액본인부담, 선택진료료, 선택진료료외]

# layout 방법. fill = 양식에 없는 열의 값, forms = 진료비영수증 양식 번호 → 표 설명과 인쇄 열(인쇄 순서) → 열 설명.
# 출처: harness-v2 docs/requirements/진료비영수증_양식별_스키마/latest/추출_[1-5]_*.json 의 항목내역 그룹.
# 양식 1 요양급여 / 2 독립비급여 / 3 독립선택진료 / 4 비급여하위항목(선택진료료+선택진료료외) / 5 독립선택진료료외.
layout:
  fill: "0"
  forms:
    1:
      name: 요양급여양식
      description: 진료비 계산서에 실제 청구된 각 진료항목(진찰료, 입원료, 투약료 등)의 내역을 나열한 표의 행을 의미하며, 각 행은 하나의 진료 항목에 대응한다. 문서 중앙의 '기본항목', '선택항목', 그 외 일반항목들('선별급여'부터 '계'까지)에서 추출한다. 이 표의 금액 열은 항목명 오른쪽의 '요양급여'(또는 '요양급여(①+②)') 열과 '비급여'(또는 '비급여③') 열, 두 개뿐이다. 각 행은 분류 칸('기본항목'·'선택항목')과 항목명 칸을 빼고 금액 칸만 왼쪽부터 세어 1열은 급여, 2열은 비급여로 읽는다. '①+②'는 참조식일 뿐 별도의 열이 아니다. 빈칸도 한 칸으로 세며, 1열이 빈칸이라고 2열 숫자를 1열로 당기지 않는다. '항목'은 '진찰료'부터 '계'까지 추출하며 '계' 이후 행은 추출하지 않는다. '계' 아래 따로 적힌 본인부담금①·공단부담금②(보험자부담금②) 행과 상한액초과금 행은 진료항목이 아니므로 추출하지 않고 '계' 행 값에도 넣지 않는다. 표의 셀이 비어 있으면 0으로 채우고, 값은 원본 셀에서 그대로 옮기며 더하거나 빼서 만들지 않는다.
      columns:
        항목: 항목은 각 줄의 항목명 칸에 적힌 이름을 추출한다 항목명이 적힌 줄마다 하나씩 출력하며, 금액이 모두 빈칸인 줄(선별급여, 65세이상정액 등), 표준 항목이 아닌 줄('100/100전액부담30%' 등), 소계·합계 줄도 출력한다. 이름이 두 줄로 나뉜 행은 하나의 행이다. 다음은 어떤 경우에도 항목이 아니다. ① 여러 줄을 세로로 묶는 '기본항목'·'선택항목' 칸 — 분류 칸이다. ② 하위 행 옆에 병합된 '투약및조제료'·'주사료'·'입원료' 칸 — 상위항목이며, 아래 교정에서 하위 이름과 합칠 때만 쓴다. 공백·줄바꿈은 정리하고 다음만 교정한다. 입원료의 1인실 → 입원료_1인실 / 2인실·3인실·2,3인실·2-3인실·2~3인실·2·3인실 → 입원료_2-3인실 / 4인실 이상·4인이상 → 입원료_4인실이상 / 투약및조제료(투약) 아래 '행위료'·'행위' → 투약및조제료_행위료, '약품비'·'약품' → 투약및조제료_약품비 / 주사료(주사) 아래 '행위료'·'행위' → 주사료_행위료, '약품비'·'약품' → 주사료_약품비 / 나뉜 '식'·'대' → 식대 / '시행령별표2제4호의요양급여'·'국민건강보험법제41조의4에따른요양급여'· → 선별급여. 그 외 이름은 원문 그대로 쓴다.
        급여: 해당 진료 항목의 요양급여 금액을 의미하며, 비급여 금액과 구분한다. 항목명 오른쪽 첫 번째 금액 열('요양급여'·'요양급여(①+②)')과 현재 행이 만나는 셀에서 찾는다. '①+②'는 참조식이므로 값을 나누거나 다른 숫자와 더하지 않는다. '계' 아래 별도 행의 본인부담금①·공단부담금② 값을 더하거나 옮겨 오지 않는다. 셀이 비어 있으면 0을 저장한다.
        비급여: 해당 진료 항목 중 건강보험 급여 대상이 아닌 비급여 금액을 의미하며, 요양급여 금액과 구분한다. 항목명 오른쪽 두 번째 금액 열('비급여'·'비급여③')과 현재 행이 만나는 셀에서 찾는다. 첫 번째 열(요양급여)이 빈칸이어도 열 위치는 바뀌지 않으므로 요양급여 열의 숫자를 비급여로 가져오지 않는다. '계' 행도 같은 열의 숫자를 그대로 옮긴다. 셀이 비어 있으면 0을 저장한다.
    2:
      name: 독립비급여양식
      description: 진료비 계산서에 실제 청구된 각 진료항목(진찰료, 입원료, 투약료 등)의 내역을 나열한 표의 행을 의미하며, 각 행은 하나의 진료 항목에 대응한다. 문서 중앙의 '기본항목', '선택항목', 그 외 일반항목들('선별급여'부터 '합계'까지)에서 추출한다. 이 표의 금액 열은 항목명 오른쪽에 본인부담금(1열)·공단부담금(2열)·전액본인부담(3열)·비급여(4열) 순서로 네 개다. 위에 '급여' 같은 상위 제목이 있어도 값이 들어가는 열은 이 네 열뿐이다. 각 행은 분류 칸('기본항목'·'선택항목')과 항목명 칸을 빼고 금액 칸만 왼쪽부터 세어 1열은 본인부담금, 2열은 공단부담금, 3열은 전액본인부담, 4열은 비급여로 읽는다. 빈칸도 한 칸으로 세며, 빈칸 때문에 오른쪽 숫자를 왼쪽 필드로 당기지 않는다. 세로 분류 칸이 있는 구간은 그 구간 첫 행만 칸이 하나 더 많으므로 분류 칸을 빼고 센다. 합계 행에서는 ①②③④ 뒤의 숫자가 각각 본인부담금·공단부담금·전액본인부담·비급여이며, 합계 아래 ⑤ 상한액초과금 행은 진료항목이 아니므로 추출하지 않는다. '항목'은 '진찰료'부터 '합계'까지 추출하며 '합계' 이후 행은 추출하지 않는다. 표의 셀이 비어 있으면 0으로 채우고, 값은 원본 셀에서 그대로 옮기며 더하거나 빼서 만들지 않는다.
      columns:
        항목: 항목은 각 줄의 항목명 칸에 적힌 이름을 추출한다 항목명이 적힌 줄마다 하나씩 출력하며, 금액이 모두 빈칸인 줄(선별급여, 65세이상정액 등), 표준 항목이 아닌 줄('100/100전액부담30%' 등), 소계·합계 줄도 출력한다. 포함범위는 '진찰료'부터 '합계'까지이며, 제외 범위는 '상한액초과금'이다. 이름이 두 줄로 나뉜 행은 하나의 행이다. 다음은 어떤 경우에도 항목이 아니다. ① 여러 줄을 세로로 묶는 '기본항목'·'선택항목' 칸 — 분류 칸이다. ② 하위 행 옆에 병합된 '투약및조제료'·'주사료'·'입원료' 칸 — 상위항목이며, 아래 교정에서 하위 이름과 합칠 때만 쓴다. 공백·줄바꿈은 정리하고 다음만 교정한다. 입원료의 1인실 → 입원료_1인실 / 2인실·3인실·2,3인실·2-3인실·2~3인실·2·3인실 → 입원료_2-3인실 / 4인실 이상·4인이상 → 입원료_4인실이상 / 투약및조제료(투약) 아래 '행위료'·'행위' → 투약및조제료_행위료, '약품비'·'약품' → 투약및조제료_약품비 / 주사료(주사) 아래 '행위료'·'행위' → 주사료_행위료, '약품비'·'약품' → 주사료_약품비 / 나뉜 '식'·'대' → 식대 /  '시행령별표2제4호의요양급여'·'국민건강보험법제41조의4에따른요양급여'·'시행령/건강보험법 ~요양급여'(노이즈/병원별 표기 차이로 인식이 어려운 경우, 기타 아래 '~법에 따른 요양급여'라고 적힌 항목은 선별급여로 매핑한다) → 선별급여. 그 외 이름은 원문 그대로 쓴다.
        본인부담금: 해당 진료 항목에 대해 건강보험 급여 적용 후 환자가 직접 부담하는 금액을 의미하며, 공단부담금·전액본인부담과 구분한다. 금액 1열('본인부담'·'본인부담금')과 현재 행이 만나는 셀에서 찾는다. 합계 행에서는 ① 뒤의 숫자다. 셀이 비어 있으면 0을 저장한다.
        공단부담금: 해당 진료 항목에 대해 건강보험공단이 부담하는 금액을 의미하며, 환자가 부담하는 본인부담금과 구분한다. 금액 2열('공단부담'·'공단부담금'·'보험자부담금')과 현재 행이 만나는 셀에서 찾는다. 합계 행에서는 ② 뒤의 숫자다. 왼쪽 1열이 빈칸이어도 열 위치는 바뀌지 않으므로 2열 숫자를 본인부담금으로 옮기지 않는다. 셀이 비어 있으면 0을 저장한다.
        전액본인부담: 해당 진료 항목에 대해 공단 지원 없이 환자가 전액 부담하는 급여 금액을 의미하며, 비급여와 구분한다. 금액 3열('전액본인부담'·'전액 본인부담')과 현재 행이 만나는 셀에서 찾는다. 합계 행에서는 ③ 뒤의 숫자다. 3열이 빈칸일 때 왼쪽 공단부담금이나 오른쪽 비급여 칸의 숫자를 대신 가져오지 않는다. 셀이 비어 있으면 0을 저장한다.
        비급여: 해당 진료 항목 중 건강보험 급여 대상이 아닌 비급여 금액을 의미하며, 전액본인부담과 구분한다. 금액 4열(마지막 열, '비급여')과 현재 행이 만나는 셀에서 찾는다. 합계 행에서는 ④ 뒤의 숫자다. 합계 아래 ⑤ 상한액초과금은 비급여가 아니므로 넣지 않는다. 셀이 비어 있으면 0을 저장한다.
    3:
      name: 독립선택진료양식

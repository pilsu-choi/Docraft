      description: 진료비 계산서에 실제 청구된 각 진료항목(진찰료, 입원료, 투약료 등)의 내역을 나열한 표의 행을 의미하며, 각 행은 하나의 진료 항목에 대응한다. 문서 중앙의 '기본항목', '선택항목', 그 외 일반항목들('선별급여'부터 '합계'까지)에서 추출한다. 이 표의 머리글은 두 줄이다. 윗줄의 '급여'와 '비급여'는 아래 열을 묶는 상위항목일 뿐 값이 들어가는 열이 아니다. 값이 들어가는 금액 열은 아랫줄의 본인부담금(1열)·공단부담금(2열)·전액본인부담(3열)·선택진료료(4열)·선택진료료외(5열) 다섯 개다. 각 행은 분류 칸('기본항목'·'선택항목')과 항목명 칸을 빼고 금액 칸만 왼쪽부터 세어 1열은 본인부담금, 2열은 공단부담금, 3열은 전액본인부담, 4열은 선택진료료, 5열은 선택진료료외로 읽는다. 빈칸도 한 칸으로 세며, 빈칸 때문에 오른쪽 숫자를 왼쪽 필드로 당기거나 왼쪽 숫자를 오른쪽 필드로 밀지 않는다. 세로 분류 칸이 있는 구간은 그 구간 첫 행만 칸이 하나 더 많으므로 분류 칸을 빼고 센다. 합계 행에서는 ①②③④⑤ 뒤의 숫자가 각각 본인부담금·공단부담금·전액본인부담·선택진료료·선택진료료외다. 합계 이전의 중간 소계 행과 상한액초과금 행은 추출하지 않는다. '항목'은 '진찰료'부터 '합계'까지 추출하며 '합계' 이후 행은 추출하지 않는다. 표의 셀이 비어 있으면 0으로 채우고, 값은 원본 셀에서 그대로 옮기며 더하거나 빼서 만들지 않는다.
      columns:
        항목: 항목은 각 줄의 항목명 칸에 적힌 이름을 추출한다 항목명이 적힌 줄마다 하나씩 출력하며, 금액이 모두 빈칸인 줄(선별급여, 65세이상정액 등), 표준 항목이 아닌 줄('100/100전액부담30%' 등), 합계 줄도 출력한다. 합계 이전의 중간 소계 줄은 출력하지 않는다. 포함범위는 '진찰료'부터 '합계'까지이며, 제외 범위는 '상한액초과금'이다. 이름이 두 줄로 나뉜 행은 하나의 행이다. 다음은 어떤 경우에도 항목이 아니다. ① 여러 줄을 세로로 묶는 '기본항목'·'선택항목' 칸 — 분류 칸이다. ② 하위 행 옆에 병합된 '투약및조제료'·'주사료'·'입원료' 칸 — 상위항목이며, 아래 교정에서 하위 이름과 합칠 때만 쓴다. 공백·줄바꿈은 정리하고 다음만 교정한다. 입원료의 1인실 → 입원료_1인실 / 2인실·3인실·2,3인실·2-3인실·2~3인실·2·3인실 → 입원료_2-3인실 / 4인실 이상·4인이상 → 입원료_4인실이상 / 투약및조제료(투약) 아래 '행위료'·'행위' → 투약및조제료_행위료, '약품비'·'약품' → 투약및조제료_약품비 / 주사료(주사) 아래 '행위료'·'행위' → 주사료_행위료, '약품비'·'약품' → 주사료_약품비 / 나뉜 '식'·'대' → 식대 /  '시행령별표2제4호의요양급여'·'국민건강보험법제41조의4에따른요양급여'·'시행령/건강보험법 ~요양급여'(노이즈/병원별 표기 차이로 인식이 어려운 경우, 기타 아래 어떠한 법에 따른 요양급여라고 적히면 선별급여로 매핑한다) → 선별급여. 그 외 이름은 원문 그대로 쓴다.
        본인부담금: 해당 진료 항목에 대해 건강보험 급여 적용 후 환자가 직접 부담하는 금액을 의미하며, 공단부담금·전액본인부담과 구분한다. '급여' 상위항목 아래 금액 1열('본인부담'·'본인부담금')과 현재 행이 만나는 셀에서 찾는다. 합계 행에서는 ① 뒤의 숫자다. 셀이 비어 있으면 0을 저장한다.
        공단부담금: 해당 진료 항목에 대해 건강보험공단이 부담하는 금액을 의미하며, 환자가 부담하는 본인부담금과 구분한다. '급여' 상위항목 아래 금액 2열('공단부담'·'공단부담금'·'보험자부담금')과 현재 행이 만나는 셀에서 찾는다. 합계 행에서는 ② 뒤의 숫자다. 왼쪽 1열이 빈칸이어도 열 위치는 바뀌지 않으므로 2열 숫자를 본인부담금으로 옮기지 않는다. 셀이 비어 있으면 0을 저장한다.
        전액본인부담: 해당 진료 항목에 대해 공단 지원 없이 환자가 전액 부담하는 급여 금액을 의미하며, 비급여 금액과 구분한다. '급여' 상위항목 아래 금액 3열('전액본인부담'·'전액 본인부담')과 현재 행이 만나는 셀에서 찾는다. 합계 행에서는 ③ 뒤의 숫자다. 3열이 빈칸일 때 왼쪽 공단부담금이나 오른쪽 선택진료료·선택진료료외 칸의 숫자를 대신 가져오지 않는다. 셀이 비어 있으면 0을 저장한다.
        선택진료료: 해당 진료 항목에 대해 선택진료로 인해 추가로 청구된 비급여 금액을 의미하며, 선택진료료외와 구분한다. '비급여' 상위항목 아래 왼쪽 열인 금액 4열('선택진료료')과 현재 행이 만나는 셀에서 찾는다. 파싱 머리글이 '비급여 선택진료료'로 붙어 보여도 이 4열이다. 합계 행에서는 ④ 뒤의 숫자다. 대부분의 행에서 빈칸이며, 4열이 빈칸일 때 오른쪽 5열(선택진료료외) 숫자를 대신 넣지 않는다. 셀이 비어 있으면 0을 저장한다.
        선택진료료외: 해당 진료 항목의 비급여 금액 중 선택진료료가 아닌 금액을 의미하며, 선택진료료와 구분한다. '비급여' 상위항목 아래 오른쪽 열인 금액 5열(마지막 열, '선택진료료외'·'선택진료료 이외')과 현재 행이 만나는 셀에서 찾는다. 머리글 '선택진료료'가 줄바꿈으로 두 번 보이거나 '외'가 다른 글자와 붙어 있어도 오른쪽 열이 이 필드다. 합계 행에서는 ⑤ 뒤의 숫자다. 왼쪽 4열(선택진료료)이 빈칸이어도 5열 숫자는 그대로 이 필드에 저장하며 선택진료료로 옮기지 않는다. 셀이 비어 있으면 0을 저장한다.

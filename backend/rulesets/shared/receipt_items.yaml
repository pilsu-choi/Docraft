# 하네스·Docraft 공통 규칙 표(진료비영수증 항목명 교정·추출 누락 검증) — Docraft(backend/rulesets/shared/receipt_items.yaml)와
# 하네스(src/mlife_harness/rulesets/shared/receipt_items.yaml)가 함께 쓴다. 두 파일은
# 바이트가 같아야 하며(harness-installer build-bundle.sh가 빌드 전에 cmp로 확인한다),
# 고칠 때는 두 저장소에 똑같이 반영한다.

# AO 프롬프트의 항목명 정규화 규칙: [정규식(앞에서 맞춘다), 표준 항목명]
item_aliases:
  - ["^입원료.*1인", "입원료_1인실"]
  - ["^입원료.*[23]", "입원료_2-3인실"]
  - ["^입원료.*4인", "입원료_4인실이상"]
  - ["^입원료.*상급", "입원료_상급병실"]
  - ["^(투약|조[제세]료).*[행생]위", "투약및조제료_행위료"]  # 투약 및 | 조제료 가 두 칸으로 갈려 읽혀도 맞춘다
  - ["^(투약|조[제세]료).*약품", "투약및조제료_약품비"]
  - ["^주[사시].*행위", "주사료_행위료"]
  - ["^주[사시].*[약역]품", "주사료_약품비"]
  - ["^재활및?물리치료", "재활및물리치료료"]  # 재활및물리치료·재활,물리치료 변형
  - ["^식대?$", "식대"]
  - ["^(계|합계|총계|합계금액)$", "합계"]
  - ["^(?=.{,40}$)(.*(시행령별표|국민건강보험법|시행법령|따른요양급여$|요양급여선별급여$)|선별급여$)", "선별급여"]  # 두 줄 칸·기호(「」·/)는 이름 만들 때 떼어 이어 붙는다.
    # 법령 근거 문구(「국민건강보험법」 제41조의4에 따른 요양급여)는 오독으로 조각나(제4조의4·제 빠짐·시행법령표) 앞부분이 달라지므로 문구의 고정 조각으로 맞춘다. 40자 이하 칸 이름만(하단 안내문 배제).
    # 선별급여및기타는 AO 프롬프트 목록에 없는 인쇄 이름이라 원문대로 둔다(고객 후처리 스키마가 선별급여의 별칭으로 받는다, 2026-10-07 결정)
  - ["^끝수.*조정", "끝수처리조정금액"]
  - ["^100100미만50", "100/100미만50%"]  # 구 요양급여 서식의 본인부담률별 행(인쇄 이름 그대로)
  - ["^100100미만80", "100/100미만80%"]
  - ["^100100미만30", "100/100미만30%"]
  - ["^100100미만90", "100/100미만90%"]
  - ["^정액수가(?!.*장기요양).*요양", "정액수가(요양병원)"]  # AO·서식 표기대로 괄호를 둔다(2026-09-24 사용자 결정). 정액수가(장기요양)은 다른 인쇄 이름이라 삼키지 않는다
  - ["^정액수가.*완화", "정액수가(완화의료)"]
  # ── 인쇄 표준명의 OCR 오독·잘림(전체 일치). 실제로 다르게 인쇄되는 정상 이름(진찰비·포괄수가진료비·종합검진·병실차액·초음파 등)은
  #    정답이 인쇄 이름을 그대로 두므로 별칭으로 넣지 않는다(2026-10-08, 고객 후처리 스키마 keywordInfo는 별칭 출처가 아니다).
  - ["^입환[료비]$", "입원료"]
  - ["^검료$", "검사료"]
  - ["^마취$", "마취료"]
  - ["^[영명]상진단$", "영상진단료"]
  - ["^방사(선)?치료$", "방사선치료료"]
  - ["^(치료|시료)(재료|제료)대?$|^재료대$", "치료재료대"]
  - ["^정신요법$", "정신요법료"]
  - ["^(전혈및)?혈액성분$", "전혈및혈액성분제제료"]
  - ["^CT진단$", "CT진단료"]
  - ["^MRI진단$", "MRI진단료"]
  - ["^PET진단$", "PET진단료"]
  - ["^초음파진단$", "초음파진단료"]
  - ["^상급[병면]실$", "상급병실료"]

# 건강보험 진료비 계산서·영수증의 표준 항목(한방진료비 계산서 항목 포함). 파서 표에서 새 행을 만들 때만 이 목록을 적용한다.
# 표기는 AO 프롬프트 규칙(기호를 뗀다, 2026-09-24 결정)이며 보철·교정료·2,3인실 같은 기호 변형도 이 이름으로 맞춘다.
# 원본 인쇄 표기에 괄호가 있는 이름은 괄호를 둔다(한약(첩약)·정액수가(요양병원) — 고객 후처리 스키마 키, 2026-10-07 결정).
# 이름 비교는 기호를 뗀 글자로 한다.
# 모델이 낸 비정형 항목은 버리지 않고 그대로 보존한다.
receipt_item_names:
  ["진찰료", "입원료", "입원료_1인실", "입원료_2-3인실", "입원료_4인실이상", "입원료_상급병실", "식대",
   "투약및조제료_행위료", "투약및조제료_약품비", "주사료_행위료", "주사료_약품비", "처치및수술", "처치및수술료", "검사료",
   "영상진단료", "방사선치료료", "마취료", "정신요법료", "재활및물리치료료", "치료재료대", "전혈및혈액성분제제료",
   "CT진단료", "MRI진단료", "PET진단료", "초음파진단료", "보철교정료", "제증명료", "정액수가",
   "정액수가(요양병원)", "포괄수가진료비", "65세이상등정액", "선별급여", "선별급여및기타", "기타", "합계", "시술및처치료",
   "한방물리요법료", "한약(첩약)", "상급병실료", "끝수처리조정금액", "정액수가(완화의료)", "질병군포괄수가",
   "100/100미만50%", "100/100미만80%", "100/100미만30%", "100/100미만90%",
   "예약진찰료", "응급의료관리료", "응급의학관리료", "응급관리료",
   "제증명수수료"]
# 제증명수수료: 「국민건강보험 요양급여의 기준에 관한 규칙」 별지 제6·7·12호서식(2024-07-18 개정)의 인쇄 항목명
# (상위 docfiles/legal-forms/sources.json). 간이 서식(제12호)의 한 줄 '투약 및 조제료'·'주사료'는 넣지 않는다 —
# 두 줄 칸('주사료<br>행위료')의 상위 칸 이름이 표준 항목이 되어 하위 행과 충돌한다.

# 법정 서식 항목 행 순서 — parse 표에서 이름을 못 읽은 행을 위·아래 인식된 행 사이에 빠진 표준 행이 정확히 하나일 때만 그 행으로 본다
# (하네스 parser_fill._fill_gaps, Docraft rules._receipt_table). 위치가 서식마다 갈리는 행(제증명료·기타·예약진찰료·응급관리료)은 넣지 않는다. 표준 항목명(receipt_item_names)이다.
item_order: [진찰료, 입원료, 입원료_1인실, 입원료_2-3인실, 입원료_4인실이상, 식대, 투약및조제료_행위료, 투약및조제료_약품비, 주사료_행위료,
             주사료_약품비, 마취료, 처치및수술료, 검사료, 영상진단료, 방사선치료료, 치료재료대, 재활및물리치료료, 정신요법료,
             전혈및혈액성분제제료, CT진단료, MRI진단료, PET진단료, 초음파진단료, 보철교정료, 선별급여, 65세이상등정액,
             정액수가(요양병원), 정액수가(완화의료), 질병군포괄수가, 합계]

# 표준 진료과목(진료과 오독 교정 사전, 의과 + 한방) — 하네스만 쓴다
departments:
  ["내과", "외과", "정형외과", "신경외과", "흉부외과", "성형외과", "마취통증의학과", "산부인과", "소아청소년과", "안과",
   "이비인후과", "피부과", "비뇨의학과", "영상의학과", "방사선종양학과", "병리과", "진단검사의학과", "결핵과", "재활의학과",
   "예방의학과", "가정의학과", "응급의학과", "핵의학과", "직업환경의학과", "신경과", "정신건강의학과",
   "치과", "구강악안면외과", "치과보철과", "치과교정과", "소아치과", "치주과", "치과보존과", "구강내과", "영상치의학과",
   "구강병리과", "예방치과", "통합치의학과",
   "한방내과", "한방부인과", "한방소아과", "한방안이비인후피부과", "한방신경정신과", "침구과", "한방재활의학과",
   "사상체질과", "한방응급"]

# 모델이 통째로 맞바꿔 읽기 쉬운 이웃 금액 열
swaps:
  - ["본인부담금", "공단부담금"]
  - ["선택진료료", "선택진료료외"]
  - ["선택진료료", "비급여"]
  - ["선택진료료외", "비급여"]

# ── 추출 누락 검증(2026-09-28 사용자 결정) ──────────────────────────────
# 룰 1: 문서 종류별로 늘 값이 있어야 하는 키(required_keys) 중 값이 채워진 비율이 min_extract_ratio 미만이면
#       하네스 검증(검토 등급 → Docraft 재판독)으로 보낸다. 인쇄되지 않아 비는 키는 목록에 넣지 않는다.
min_extract_ratio: 0.97
# 목록은 정답지(Docraft 라벨)에서 95% 이상 값이 있던 키다(2026-09-28, 라벨 9~19건 + AO 205건). 사고발생일자(다른 날짜에서
# 만드는 값)·환자 개인정보(가림·미인쇄가 잦다)·진단서 임상적추정/최종진단(빈 값은 정규화가 N 으로 채운다)은 뺐다.
# 납부할금액은 예전 요양급여 영수증 서식에 칸이 없어 뺐다.
# 환자정보-진료종료일은 인쇄된 종료일만 두므로(2026-10-03 결정: 진료기간에 날짜 하나면 빈칸) 뺐다. 정답지 채움률 약 50%.
required_keys:
  진단서: ["발급일", "병원명", "병원주소", "병명내역"]
  소견서: ["발급일", "병원명", "병명내역"]
  입원확인서: ["입원일자", "퇴원일자", "발급일", "병원명", "병명내역"]
  수술확인서: ["발급일", "병원명", "병명내역", "수술내역"]
  진료비영수증: ["외래/입원", "발행일", "의료기관정보-명칭", "의료기관정보-사업자등록번호", "의료기관정보-주소",
               "환자정보-진료과", "환자정보-진료시작일", "환자정보-환자구분",
               "진료비총액", "환자부담총액", "항목내역"]
  세부내역서: ["항목내역"]
  약제영수증: ["조제일자", "진료비내역-총액", "진료비내역-급여본인부담", "진료비내역-공단부담액",
             "진료비내역-비급여및전액본인부담금", "진료비내역-환자부담총액", "소득공제대상액-수납금액",
             "약국정보(상호)", "약국정보(사업자등록번호)"]

# 룰 2: 항목내역 표에 반드시 있어야 하는 행. 하나라도 없으면 하네스 검증으로 보낸다.
required_items:
  진료비영수증: ["진찰료", "CT진단료"]
# 항목내역에 이 이름(정규식, 앞에서 맞춘다)의 행이 있는 서식은 그 필수 항목을 보지 않는다. 한방 진료비 영수증에는 CT진단료 칸이 없다.
required_items_exempt:
  CT진단료: ["^한방", "^한약", "^첩약"]

# 룰 5(기대 칸, 2026-10-02): 항목내역의 인쇄 열(AO parse 표 머리글)을 알 때만 본다 — 모르면 건너뛴다.
#   (a) 인쇄된 열이 항목 행 전체에서 비면, (b) 아래 행 종류별 열 중 인쇄된 열의 칸이 비면 하네스 검증으로 보낸다.
# 행 종류: item_row(항목 행)·subtotal_row(계·소계)·total_row(합계)·adjustment_row(끝수 조정). 금액 칸이 모두 빈 행은 (b)에서 뺀다.
# 처음 값은 정답지 59건 채움률 100%·칸 20개 이상인 (문서 종류, 열, 행 종류)다(2026-10-02, e2e/out/exp-1002-expected).
# 급여구분, 요약 행의 단가·횟수·일수·투여량, 행 종류를 정하는 칸(합계·소계 행 항목), parse 머리글로 알 수 없는 원내코드는 뺐다.
required_cells:
  세부내역서:
    item_row: ["본인부담", "공단부담", "전액본인부담", "비급여", "선택진료료", "선택진료료외", "급여"]
    subtotal_row: ["총액", "본인부담", "공단부담", "전액본인부담", "비급여", "선택진료료", "선택진료료외", "급여"]
    adjustment_row: ["항목", "본인부담", "공단부담", "선택진료료", "선택진료료외", "급여"]
  진료비영수증:
    item_row: ["항목", "본인부담금", "공단부담금", "전액본인부담", "비급여", "선택진료료", "선택진료료외", "급여"]
    total_row: ["본인부담금", "공단부담금", "전액본인부담", "비급여", "선택진료료", "선택진료료외", "급여"]


# 하네스·Docraft 공통 규칙 표(진료비영수증 항목명 교정·추출 누락 검증) — Docraft(backend/rulesets/shared/receipt_items.yaml)와
# 하네스(src/mlife_harness/rulesets/shared/receipt_items.yaml)가 함께 쓴다. 두 파일은
# 바이트가 같아야 하며(harness-installer build-bundle.sh가 빌드 전에 cmp로 확인한다),
# 고칠 때는 두 저장소에 똑같이 반영한다.

# AO 프롬프트의 항목명 정규화 규칙: [정규식(앞에서 맞춘다), 표준 항목명]
item_aliases:
  - ["^입원료.*1인", "입원료_1인실"]
  - ["^입원료.*[23]", "입원료_2-3인실"]
  - ["^입원료.*4인", "입원료_4인실이상"]
  - ["^입원료.*상급", "입원료_상급병실"]
  - ["^(투약|투약및조제료).*행위", "투약및조제료_행위료"]
  - ["^(투약|투약및조제료).*약품", "투약및조제료_약품비"]
  - ["^주사.*행위", "주사료_행위료"]
  - ["^주사.*약품", "주사료_약품비"]
  - ["^식대?$", "식대"]
  - ["^(계|합계|총계|합계금액)$", "합계"]
  - ["^(시행령별표2제4호|국민건강보험법제41조의4)", "선별급여"]
  - ["^정액수가.*요양", "정액수가(요양병원)"]  # AO·서식 표기대로 괄호를 둔다(2026-09-24 사용자 결정)
  - ["^정액수가.*완화", "정액수가(완화의료)"]

# 건강보험 진료비 계산서·영수증의 표준 항목(한방진료비 계산서 항목 포함). 파서 표에서 새 행을 만들 때만 이 목록을 적용한다.
# 모델이 낸 비정형 항목은 버리지 않고 그대로 보존한다.
receipt_item_names:
  ["진찰료", "입원료", "입원료_1인실", "입원료_2-3인실", "입원료_4인실이상", "입원료_상급병실", "식대",
   "투약및조제료_행위료", "투약및조제료_약품비", "주사료_행위료", "주사료_약품비", "처치및수술", "처치및수술료", "검사료",
   "영상진단료", "방사선치료료", "마취료", "정신요법료", "재활및물리치료료", "치료재료대", "전혈및혈액성분제제료",
   "CT진단료", "MRI진단료", "PET진단료", "초음파진단료", "보철교정료", "제증명료", "정액수가",
   "정액수가(요양병원)", "포괄수가진료비", "65세이상등정액", "선별급여", "기타", "합계", "시술및처치료",
   "한방물리요법료", "한약첩약", "상급병실료", "끝수처리조정금액", "정액수가(완화의료)", "질병군포괄수가"]

# 모델이 통째로 맞바꿔 읽기 쉬운 이웃 금액 열
swaps:
  - ["본인부담금", "공단부담금"]
  - ["선택진료료", "선택진료료외"]
  - ["선택진료료", "비급여"]
  - ["선택진료료외", "비급여"]

# ── 추출 누락 검증(2026-09-28 사용자 결정) ──────────────────────────────
# 룰 1: 문서 종류별로 늘 값이 있어야 하는 키(required_keys) 중 값이 채워진 비율이 min_extract_ratio 미만이면
#       하네스 검증(검토 등급 → Docraft 재판독)으로 보낸다. 인쇄되지 않아 비는 키는 목록에 넣지 않는다.
min_extract_ratio: 0.97
# 목록은 정답지(Docraft 라벨)에서 95% 이상 값이 있던 키다(2026-09-28, 라벨 9~19건 + AO 205건). 사고발생일자(다른 날짜에서
# 만드는 값)·환자 개인정보(가림·미인쇄가 잦다)·진단서 임상적추정/최종진단(택일 체크라 하나는 늘 빈다)은 뺐다.
# 납부할금액은 예전 요양급여 영수증 서식에 칸이 없어 뺐다.
required_keys:
  진단서: ["발급일", "병원명", "병원주소", "병명내역"]
  소견서: ["발급일", "병원명", "병명내역"]
  입원확인서: ["입원일자", "퇴원일자", "발급일", "병원명", "병명내역"]
  수술확인서: ["발급일", "병원명", "병명내역", "수술내역"]
  진료비영수증: ["외래/입원", "발행일", "의료기관정보-명칭", "의료기관정보-사업자등록번호", "의료기관정보-주소",
               "환자정보-진료과", "환자정보-진료시작일", "환자정보-진료종료일", "환자정보-환자구분",
               "진료비총액", "환자부담총액", "항목내역"]
  세부내역서: ["항목내역"]
  약제영수증: ["조제일자", "진료비내역-총액", "진료비내역-급여본인부담", "진료비내역-공단부담액",
             "진료비내역-비급여및전액본인부담금", "진료비내역-환자부담총액", "소득공제대상액-수납금액",
             "약국정보(상호)", "약국정보(사업자등록번호)"]

# 룰 2: 항목내역 표에 반드시 있어야 하는 행. 하나라도 없으면 하네스 검증으로 보낸다.
required_items:
  진료비영수증: ["진찰료", "CT진단료"]

# 룰 3·4: 추출값이 빈 금액 칸을 Agentic OCR parse 표(HTML)의 값으로 보충할 때의 파서 오류 판별.
# 한 칸에 숫자가 둘 이상이면 오류이고, 표의 금액 칸 절삭평균(큰 값 3개 제외)의 parser_outlier_ratio배를 넘는 칸도 오류로 보고 쓰지 않는다.
# 30배: 표본 205건의 정상 금액 칸 최대 26.2배(0건 오탐)
parser_trim_top: 3
parser_outlier_ratio: 30

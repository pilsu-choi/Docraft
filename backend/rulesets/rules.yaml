# 영역 → 그 영역의 필드. 환자 칸·의료기관 칸이 같은 라벨을 나눠 쓰는 필드만 영역을 따진다.
field_section:
  "환자": ["주소", "연락처", "이름", "환자성명", "환자정보-성명"]
  "기관": ["병원주소", "병원연락처", "병원명", "의사명", "의료기관정보-주소", "의료기관정보-명칭", "약국정보(주소)", "약국정보(상호)"]

# 유형 → 그 유형에 원래 드문 필드. 제 이름 라벨일 때만 채운다.
explicit:
  "소견서": ["진단일", "초진일"]

# '진료기간(입원기간) A ~ B' 한 칸에서 마지막 날짜를 취할 필드

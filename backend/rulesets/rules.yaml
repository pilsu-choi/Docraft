  "수술내역": ["수술일자"]
  "검사내역": ["검사일"]
  "치료내역": ["치료일"]
  "행위내역": ["행위일"]

# 표 → 소견 문장을 담은 칸의 라벨(labels), 날짜 열(date), 이름 열(name). 전용 표가 없는 서식에서 행을 만든다.
# 뒤의 표는 앞의 표에 이미 담긴 내용을 다시 담지 않는다(수술·검사를 적은 소견 문장은 치료내역이 되지 않는다).
notes:

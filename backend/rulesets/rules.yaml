# 룰 데이터 표. ``backend/rules.py``가 import 때 읽어 같은 이름의 모듈 속성(대문자)으로 둔다.
# 표 대부분이 유형을 가리지 않고, 유형별 표(totals·keep_totals·explicit)는 작아서 파일 하나에 둔다.
# 최상위 키는 아래에 있는 것만 받는다(모르는 키는 import 때 오류).

# 유형 → 끌 룰 id 목록(``rules.RULES``의 id). 모르는 룰 id는 import 때 오류.
disable: {}

# 유형 → 비어 있으면 안 되는 필드·표(doctypes key). ``{표: {열: 조건 열}}``은 조건 열이 찬 행에서 그 열이 비면 안 된다는 뜻이다.
# 정답 라벨 93건에서 빈 비율이 5%를 넘는 필드는 넣지 않는다(서식에 원래 없을 수 있다).
required:
  # 진단서_고도화_plugin.js:795-828 병명이 모두 비면 LLM으로 만든다, :525-536 발급일을 본문에서 보충한다. 병원명은 라벨 0/56 빈 값
  "진단서": ["병명내역", "발급일", "병원명", {"병명내역": {"병명": "병명코드"}}]
  "소견서": ["병명내역", "발급일", "병원명", {"병명내역": {"병명": "병명코드"}}]
  # 수술일자는 수술명과 짝(:472-495). 진단서·소견서는 수술일자 없이 수술명만 적은 라벨이 3/18이라 수술확인서에만 둔다
  "수술확인서": ["병명내역", "발급일", "병원명", "수술내역", {"병명내역": {"병명": "병명코드"}, "수술내역": {"수술일자": "수술명"}}]
  # 입원일자·퇴원일자 보충(:539-568). 반출 샘플·라벨 모두 빈 값 없음
  "입퇴원확인서": ["병명내역", "발급일", "병원명", "입원일자", "퇴원일자", {"병명내역": {"병명": "병명코드"}}]
  # 머리글(등록번호·환자구분·진료기간)은 이어지는 쪽에 인쇄되지 않아 라벨 1/9이 비어 있다. 급여 합계는 UNPRINTED_NULL이 비운다
  "세부내역서": ["항목내역"]
  # 반출 샘플 7건에 늘 있는 값. 요양기관종류는 라벨 1/9이 비어 있어 뺀다.
  # 납부할금액은 예전 요양급여 서식에 칸이 없어 뺀다(0922 재테스트에서 걸린 3건 중 2건)
  "진료비영수증": ["진료비총액", "환자부담총액", "발행일", "의료기관정보-명칭", "의료기관정보-주소",
                  "의료기관정보-사업자등록번호", "항목내역"]
  # 약제비영수증.js:17 essentialItems 중 라벨 빈 값이 5% 이하인 것 + 반출 샘플의 조제일자·총액.
  # 환자성명 11/19(가림), 병원명 7/19, 발행일 2/19, 약국 주소 2/19는 뺀다
  "약제비영수증": ["약국정보(상호)", "약국정보(사업자등록번호)", "조제일자", "진료비내역-총액"]


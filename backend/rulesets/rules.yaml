marks:
  {"검사": "검사내역", "수술": "수술내역", "치료": "치료내역"}

# 합계 필드 → 합계 행에서 더할 열(요건 1절 합계식). 비급여와 선택진료료·선택진료료외는 한쪽만 값을 갖는
# 묶음 제목·하위 열 관계라 함께 더해도 겹치지 않는다.
total_fields:

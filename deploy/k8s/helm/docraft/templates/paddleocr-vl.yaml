{{- if .Values.paddleocrVl.enabled }}
{{- $fn := include "dft.fullname" . -}}
{{- $p := .Values.paddleocrVl -}}
{{- include "dft.requireGpuNode" (dict "ctx" . "gpu" $p) }}
# =============================================================================
# PaddleOCR-VL 레이아웃 파서 — vlm-server(vLLM 백엔드, 실제 추론) + api(paddlex serve, HTTP 앞단).
# compose(paddleocr-vlm-server·paddleocr-vl-api)와 같은 이미지·명령이다.
#
# api 컨테이너가 쓰는 pipeline_config_vllm.yaml 의 genai 백엔드 기본 주소가 이미지에
# "http://paddleocr-vlm-server:8080/v1"로 박혀 있다(PaddleOCR 저장소
# deploy/paddleocr_vl_docker/pipeline_config_vllm.yaml) — 그래서 아래 vlm-server Service
# 이름은 릴리스 접두사 없이 고정한다. 바꾸면 api 가 백엔드를 못 찾는다.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-paddleocr-vl-config
  labels: {{- include "dft.labels" . | nindent 4 }}
data:
  # RTX 4070(compose 기본 0.6)·L40S(고객 기본 0.25) 등 GPU 크기에 맞춰 값으로 뺀다.
  vllm_config.yaml: |
    gpu-memory-utilization: {{ $p.gpuMemoryUtilization }}
    max-num-seqs: {{ $p.maxNumSeqs }}
    max-num-batched-tokens: {{ $p.maxNumBatchedTokens }}
---
apiVersion: v1
kind: Service
metadata:
  # 접두사 없이 고정 — 위 주석 참고.
  name: paddleocr-vlm-server
  labels: {{- include "dft.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "dft.selector" (dict "ctx" . "component" "paddleocr-vlm-server") | nindent 4 }}
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-paddleocr-vlm-server
  labels: {{- include "dft.labels" . | nindent 4 }}
spec:
  replicas: 1
  # GPU 카드 하나를 신·구 파드가 동시에 잡을 수 없다.
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "dft.selector" (dict "ctx" . "component" "paddleocr-vlm-server") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dft.selector" (dict "ctx" . "component" "paddleocr-vlm-server") | nindent 8 }}
    spec:
      {{- include "dft.gpuScheduling" . | nindent 6 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      enableServiceLinks: false
      # 이미지가 root 를 전제로 한다(compose user: root) — 벤더 이미지라 비 root 전환은 검증 전.
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      initContainers:
        {{- include "dft.gpuCheck" (dict "ctx" . "image" (include "dft.image" (dict "ctx" . "name" "paddleocrVlmServer")) "gpu" $p) | nindent 8 }}
      containers:
        - name: vlm-server
          image: {{ include "dft.image" (dict "ctx" . "name" "paddleocrVlmServer") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["paddleocr", "genai_server", "--model_name", {{ $p.model | quote }}, "--host", "0.0.0.0", "--port", "8080", "--backend", "vllm", "--backend_config", "/home/paddleocr/vlm_server_config.yaml"]
          env:
            {{- include "dft.gpuEnv" $p | nindent 12 }}
          ports: [{ name: http, containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false }
          # 모델 로딩이 오래 걸린다(compose start_period 300s와 같은 여유).
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10, timeoutSeconds: 5 }
          livenessProbe:  { httpGet: { path: /health, port: http }, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3 }
          resources: {{- include "dft.gpuResources" (dict "res" $p.resources.vlmServer "gpu" $p) | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /home/paddleocr/vlm_server_config.yaml, subPath: vllm_config.yaml }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: config
          configMap: { name: {{ $fn }}-paddleocr-vl-config }
        # compose shm_size: 4gb 와 같다.
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 4Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-paddleocr-vl-api
  labels: {{- include "dft.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "dft.selector" (dict "ctx" . "component" "paddleocr-vl-api") | nindent 4 }}
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-paddleocr-vl-api
  labels: {{- include "dft.labels" . | nindent 4 }}
spec:
  replicas: {{ $p.apiReplicas | default 1 }}
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "dft.selector" (dict "ctx" . "component" "paddleocr-vl-api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dft.selector" (dict "ctx" . "component" "paddleocr-vl-api") | nindent 8 }}
    spec:
      {{- include "dft.gpuScheduling" . | nindent 6 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      initContainers:
        {{- include "dft.gpuCheck" (dict "ctx" . "image" (include "dft.image" (dict "ctx" . "name" "paddleocrVl")) "gpu" $p) | nindent 8 }}
        # compose 의 depends_on condition:service_healthy 에 해당한다 — vlm-server 준비 전에
        # paddlex --serve 가 뜨면 첫 요청에서 바로 실패한다.
        - name: wait-for-vlm-server
          image: {{ include "dft.image" (dict "ctx" . "name" "paddleocrVl") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "until curl -fsS http://paddleocr-vlm-server:8080/health >/dev/null; do echo 'vlm-server 대기...'; sleep 5; done"]
          securityContext: { allowPrivilegeEscalation: false }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 128Mi }
      containers:
        - name: api
          image: {{ include "dft.image" (dict "ctx" . "name" "paddleocrVl") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # compose 와 같은 sed — model_name 만 값으로 바꾼다.
          command: ["/bin/bash", "-c", "sed 's/model_name: PaddleOCR-VL.*/model_name: {{ $p.model }}/' /home/paddleocr/pipeline_config_vllm.yaml > /tmp/pipeline.yaml && exec paddlex --serve --pipeline /tmp/pipeline.yaml"]
          env:
            {{- include "dft.gpuEnv" $p | nindent 12 }}
          ports: [{ name: http, containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false }
          startupProbe:  { httpGet: { path: /health, port: http }, periodSeconds: 10, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10, timeoutSeconds: 5 }
          livenessProbe:  { httpGet: { path: /health, port: http }, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3 }
          resources: {{- include "dft.gpuResources" (dict "res" $p.resources.api "gpu" $p) | nindent 12 }}
          volumeMounts:
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 4Gi }
{{- end }}

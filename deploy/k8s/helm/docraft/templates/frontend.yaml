{{- if .Values.frontend.enabled }}
{{- $fn := include "dft.fullname" . -}}
# =============================================================================
# 프론트엔드(nginx). 이미지에 구운 frontend/nginx.conf 가 backend 를 고정 호스트명
# "http://backend:8000"으로 프록시하므로(compose 서비스 이름), 실제 backend Service 주소로
# 덮어쓴 ConfigMap을 얹는다 — 이미지를 바꾸지 않고도 차트 어느 릴리스 이름에서든 동작한다.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-frontend-nginx
  labels: {{- include "dft.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 30m;

        location /api/ {
            proxy_pass http://{{ $fn }}-backend:{{ .Values.backend.port }}/api/;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri /index.html;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-frontend
  labels: {{- include "dft.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector: {{- include "dft.selector" (dict "ctx" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-frontend
  labels: {{- include "dft.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: {{- include "dft.selector" (dict "ctx" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dft.selector" (dict "ctx" . "component" "frontend") | nindent 8 }}
    spec:
      {{- include "dft.podCommon" . | nindent 6 }}
      # 공식 nginx 이미지는 마스터 프로세스가 root 로 80번 포트를 바인딩한 뒤 워커로 내려간다 —
      # runAsNonRoot 를 강제하면 80이 특권 포트라 바인딩에 실패한다. 쓰기 필요한 경로만 emptyDir 로 연다.
      containers:
        - name: frontend
          image: {{ include "dft.image" (dict "ctx" . "name" "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 80 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /, port: http }, periodSeconds: 30, failureThreshold: 3 }
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
            - { name: tmp, mountPath: /tmp }
            - { name: run, mountPath: /var/run }
            - { name: cache, mountPath: /var/cache/nginx }
      volumes:
        - name: nginx-conf
          configMap: { name: {{ $fn }}-frontend-nginx }
        - { name: tmp, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: cache, emptyDir: {} }
{{- end }}

# =============================================================================
# Docraft · Helm values
# =============================================================================
# harness-installer 우산 차트의 서브차트로 쓸 것을 전제로 한다 — Postgres·Redis는 이 차트가
# 띄우지 않는다(externalDatabase.url / externalRedis.url 로 harness-v2 쪽을 가리킨다).
#
# 자주 바꾸는 것:
#   image.registry              내부 레지스트리 주소(비우면 노드에 import 한 이미지를 쓴다)
#   externalDatabase.url        harness pgvector Postgres의 docraft 전용 DB
#   externalRedis.url           harness redis(QUEUE_NAME 으로 분리)
#   paddleocrVl.enabled / paddleocrLines.enabled / vllmVlm.enabled   GPU 컴포넌트 켜고 끄기
#   각 컴포넌트의 gpuCount(device plugin 자원 요청, 기본) / deviceIds(카드 번호 직접 지정)
#   gpu.nodeSelector             deviceIds(카드 지정 모드)를 쓰는 GPU 파드가 뜰 노드(그때만 필수)
#   models.volume.hostPath       vLLM VLM 가중치 루트(반입 번들이 채운다)
# =============================================================================

# ── 이미지 ──────────────────────────────────────────────────────────────
image:
  # 내부 레지스트리 주소(예: harbor.corp.local/docraft). 값이 있으면 모든 이미지가
  # "<registry>/<repository>:<tag>" 로 바뀐다. 비워 두면 "<repository>:<tag>" 그대로
  # — 노드 containerd 에 직접 import 한 경우다.
  registry: ""
  # IfNotPresent 여야 노드 import 방식이 동작한다(Always 면 레지스트리를 찾아 나선다).
  pullPolicy: IfNotPresent
  pullSecrets: []   # 예: [{name: harbor-cred}]

images:
  # backend·frontend 는 저장소 Dockerfile 로 빌드해 내부 레지스트리에 올린 이미지다(우산 차트가 빌드).
  backend:  { repository: docraft-backend,  tag: latest }
  frontend: { repository: docraft-frontend, tag: latest }
  # PaddleOCR-VL 레이아웃 파서(compose와 같은 이미지 두 개). vlm-server 는 실제 vLLM 백엔드,
  # paddleocrVl 은 paddlex serve API(paddleocr-lines 도 같은 이미지를 쓴다).
  paddleocrVlmServer: { repository: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-vllm-server, tag: latest-nvidia-gpu-offline }
  paddleocrVl:        { repository: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl,               tag: latest-nvidia-gpu-offline }
  # Qwen3-VL 서빙. harness와 같은 이미지·태그를 써서 반입 번들에 한 번만 싣는다.
  vllm:               { repository: vllm/vllm-openai, tag: v0.29.0 }
  # vllmVlm.parallel: replicas 의 라우터(templates/vllm-router.yaml). CPU 만 쓴다.
  envoy:              { repository: envoyproxy/envoy-distroless, tag: v1.35.0 }

# ── 비밀값 ──────────────────────────────────────────────────────────────
auth:
  # 이미 만든 Secret 을 쓰려면 이름을 준다. 키: DATABASE_URL, CELERY_BROKER_URL,
  # DOCRAFT_API_KEY(없어도 뜬다 — 그때 API 인증 없음), AI_API_KEY, HARNESS_DATABASE_URL(없어도 뜬다)
  existingSecret: ""
  # Docraft API 인증(X-API-Key). 비우면 인증 없음(내부망 테스트 기본값).
  apiKey: ""
  # vLLM(templates/vllm-vlm.yaml)의 --api-key 와 backend AI_API_KEY 가 함께 읽는 키.
  # backend/config.py 의 ai_settings() 는 base_url·model 이 있어도 이 값이 비어 있으면
  # "미설정"으로 본다 — 그래서 기본값도 비워 두지 않는다(운영에서는 openssl rand -hex 32 로 바꾼다).
  aiApiKey: "docraft"

# ── 백엔드(FastAPI) ────────────────────────────────────────────────────
backend:
  # 2 이상이면 파드 하나가 죽거나(OOMKilled 등) 재시작해도 서비스가 이어진다. 작업 상태는 Postgres(조건부 UPDATE)라 파드끼리
  # 겹쳐 돌아도 안전하다. 아래 vlmConcurrency·ocrConcurrency·tablePageConcurrency 와 queue.concurrency 는 전체 합계이고
  # 파드마다 올림 나눈 몫이 들어간다. resources 는 파드마다 적용된다.
  replicas: 1
  port: 8000
  service:
    type: ClusterIP
  # 문자열로 둔다 — helm 의 값 YAML→JSON 왕복에서 큰 정수가 float64 가 되어 quote 시
  # 지수 표기(2.62144e+07)로 깨지는 문제를 피한다.
  maxUploadBytes: "26214400"
  # 콤마 구분 origin. 프론트엔드를 이 차트의 nginx(동일 오리진 프록시)로만 쓰면 비워도 된다.
  corsOrigins: ""
  logLevel: INFO
  # 실패한 /api/read* 요청의 입력·실패 한 줄·받아 둔 VLM 응답을 PVC(/data/failed/<날짜>/<rid>/)에 보존해 재현에 쓴다.
  # failedKeepDays 일이 지나거나 합계가 failedMaxMb 를 넘으면 오래된 것부터 지운다. 0 이면 보존하지 않는다(README 실패 입력 보존).
  failedKeepDays: 7
  failedMaxMb: 2048
  # 이 시간(ms)보다 오래 걸린(또는 실패한) VLM 호출은 INFO 로 한 줄 남긴다. 평소 호출은 DEBUG.
  vlmSlowMs: 15000
  aiVision: true
  aiReasoning: "off"
  # VLM 호출 한 번의 최대 대기(초). 느린 GPU 에서는 늘린다(L40S: 300 — 스키마 생성이 90초를 넘었다).
  aiTimeout: 90
  tableRefine: false
  # 표 첫 추출 방식(band | rowmajor | asis)과 rowmajor 세부내역서 asis 재추출 기준 — README 설정 표 참고.
  tableExtract: band
  tableRecheckRatio: 2  # 1보다 크면 표 다시 읽기 끔(기본). 켤 때 0.6
  # 기울어진 페이지(0.3~45도, 그 너머는 90도 회전 몫)를 모델에 보내는 이미지에서만 바로 세운다(OCR 좌표는 그대로).
  pageDeskew: true
  # tableExtract: band 일 때 위치부터 찾아 띠로 읽는 문서 유형(쉼표 목록). 나머지 유형은 rowmajor.
  bandDocTypes: 진료비영수증,세부내역서
  # band 로 읽은 영수증의 반 행 인쇄 밀림을 OCR 줄 좌표로 되돌린다(README PRINT_REGISTER).
  printRegister: false
  # provider 동시 호출 수(0이면 제한 없음), repetition_penalty(빈 값이면 보내지 않음)
  # vLLM --max-num-seqs 에서 같은 vLLM 을 쓰는 harness 몫을 뺀 값에 맞춘다(README VLM_CONCURRENCY).
  vlmConcurrency: 8
  # OCR(레이아웃) 동시 호출 수, 여러 쪽 표의 쪽 묶음 동시 호출 수
  ocrConcurrency: 2
  tablePageConcurrency: 4
  # band 지연 줄이기(README BAND_PRELOCATE·BAND_SPECULATE, 결과 동일)
  bandPrelocate: true
  bandSpeculate: true
  repetitionPenalty: ""
  # uvicorn 프로세스 수. 2 이상이면 같은 페이지 OCR 공유·cancel-all 이 프로세스마다 따로이고 메모리가 그만큼 는다
  # (resources.limits.memory 도 함께 늘린다). 기본 1.
  webConcurrency: 1
  # 여기 없는 설정을 더 넣을 때(backend/config.py 의 환경변수명 그대로)
  extraEnv: {}
  resources:
    requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 256Mi }
    limits:   { memory: 2Gi, ephemeral-storage: 8Gi }

# Celery 워커(선택). QUEUE_BACKEND=celery 일 때만 의미가 있다 — inline 이면 배포하지 않는다.
worker:
  enabled: false
  replicas: 1
  resources:
    requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 256Mi }
    limits:   { memory: 2Gi, ephemeral-storage: 8Gi }

# 프론트엔드(nginx). 기본은 꺼짐 — 우산 차트나 별도 정적 호스팅을 쓸 수 있어 선택으로 둔다.
frontend:
  enabled: false
  replicas: 1
  service:
    type: ClusterIP
    nodePort: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi, ephemeral-storage: 64Mi }
    limits:   { memory: 256Mi, ephemeral-storage: 1Gi }

# ── 작업 큐 ─────────────────────────────────────────────────────────────
queue:
  # inline = API 프로세스 스레드 풀(기본, 추가 인프라 불필요). celery = externalRedis 브로커 사용,
  # worker.enabled=true 도 같이 켠다.
  backend: inline
  # 공용 redis/Celery 를 쓸 때 큐·태스크·키를 분리하는 네임스페이스(backend/jobs.py).
  name: docraft
  concurrency: 2
  # 이 시간(초) 동안 heartbeat 이 없으면 죽은 작업으로 보고 다시 받는다.
  leaseSeconds: 600

# ── KCD·EDI 마스터 (backend/master.py) ─────────────────────────────────
# 조회는 프로세스당 한 번, 다음 순서로 해결된다: 1) harnessDatabaseUrl(있으면 재사용, 원본 재적재 불필요)
# 2) docraft DB(master_code, 이미 적재돼 있으면) 3) sourceImage(원본을 docraft DB로 신규 적재).
master:
  # harness-v2 Postgres를 읽기전용 재사용. 예: postgresql://<user>:<pw>@mlife-harness-postgres:5432/mlife_harness
  # (우산 차트가 채운다). 비어 있으면 다음 소스로 넘어간다.
  harnessDatabaseUrl: ""
  # 값이 있으면(harness master 이미지, 예: mlife-harness-master) backend·worker pod에 initContainer가 붙어
  # 이 이미지의 /opt/master를 emptyDir(/master)로 복사하고 MASTER_SOURCE_DIR=/master를 채운다.
  sourceImage:
    repository: ""
    tag: ""

# ── 외부 DB·큐 (이 차트는 Postgres·Redis 를 띄우지 않는다) ───────────────
externalDatabase:
  # 필수. 예: postgresql://docraft:<pw>@mlife-harness-postgres:5432/docraft
  # (harness pgvector Postgres에 docraft 전용 DB를 만들어 가리킨다 — 우산 차트가 채운다)
  url: ""
externalRedis:
  # queue.backend=celery 일 때만 필요. 예: redis://mlife-harness-redis:6379/1
  # (harness redis 공유 — QUEUE_NAME 으로 키·큐가 분리되므로 DB 번호만 겹치지 않게 한다)
  url: ""

# ── 스토리지 ────────────────────────────────────────────────────────────
# emptyDir 크기 상한(노드 디스크가 차 다른 파드까지 퇴거되는 것을 막는다). 컨테이너 ephemeral-storage limits 와 별개로 볼륨마다 건다.
ephemeral:
  tmp: 2Gi            # backend·worker·frontend 의 /tmp(업로드 임시파일·PDF 렌더), frontend nginx 캐시
  masterSource: 1Gi   # master.sourceImage 복사본(/master)

persistence:
  storageClass: ""
  # backend·worker 가 함께 쓰는 /data(업로드 원본).
  data:
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: ""
  # paddleocr-lines 가 첫 기동 때 받는 PP-OCRv5 모델 캐시($HOME/.paddlex).
  # ⚠️ 공식 이미지는 이 캐시를 huggingface/paddle 허브에서 내려받는다 — 폐쇄망에서는 사전에
  # 채워 둬야 한다(반입 번들이 hostPath 로 주입하거나, PVC 를 임시 파드로 채운 뒤 붙인다).
  paddlexModels:
    size: 5Gi
    storageClass: ""
    # 값이 있으면 PVC 대신 이 경로를 hostPath 로 붙인다(모델 볼륨과 같은 반입 방식).
    hostPath: ""

# ── vLLM VLM 가중치 볼륨 (Qwen3-VL) ────────────────────────────────────
models:
  volume:
    # 반입 번들이 노드마다 여기에 <모델 서브디렉터리>를 둔다(vllmVlm.modelDir).
    hostPath: /opt/docraft/models
    # 값이 있으면 hostPath 대신 이 PVC(같은 구조)를 읽기전용으로 붙인다. hostPath 는 Pod Security
    # baseline·restricted 네임스페이스에서 거부된다.
    existingClaim: ""

# ── GPU 파드 공통 스케줄링 ───────────────────────────────────────────────
# paddleocr-vl(vlm-server·api) · paddleocr-lines · vllm-vlm 세 컴포넌트에 적용된다. 컴포넌트마다
# 아래 두 방식 중 하나로 GPU 를 할당한다(각 컴포넌트의 gpuCount/deviceIds 주석 참고):
#   · device plugin 모드(deviceIds 비움, 기본) — nvidia.com/gpu 를 gpuCount 장 요청한다. 스케줄러가
#     유휴 카드를 알아서 고르므로 아래 nodeSelector 가 없어도 된다. 한 카드를 여러 파드가 나눠
#     쓰려면(예: paddleocrVl 과 paddleocrLines) device plugin time-slicing 설정이 있어야 한다 —
#     GPU 메모리는 격리되지 않으므로 함께 쓰는 컴포넌트의 gpuMemoryUtilization 비율 합이 카드
#     하나에 들어와야 한다.
#   · 카드 지정 모드(deviceIds 채움) — device plugin 을 우회해 nvidia.com/gpu 를 요청하지 않고
#     NVIDIA_VISIBLE_DEVICES 로 그 번호의 카드를 직접 붙인다(harness-v2 INSTALL.md §11과 같은
#     방식). 노드의 nvidia-container-toolkit 이
#     accept-nvidia-visible-devices-envvar-when-unprivileged=true 여야 하고(GPU Operator 기본은
#     false), 스케줄러가 이 사용량을 모르므로 아래 nodeSelector 로 노드를 직접 지정해야 한다
#     (비우면 렌더링이 멈춘다 — dft.requireGpuNode).
gpu:
  nodeSelector: {}
  tolerations:
    - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
  # nvidia 가 기본 런타임이 아닌 클러스터(k3s·RKE2 등)는 "nvidia".
  runtimeClassName: ""

# ── PaddleOCR-VL 레이아웃 파서 (GPU) ───────────────────────────────────
# vlm-server(vLLM 백엔드, 실제 추론)와 api(paddlex serve, HTTP 앞단) 두 파드로 뜬다.
paddleocrVl:
  enabled: false
  model: PaddleOCR-VL-1.6-0.9B
  # 쓸 GPU 장수(device plugin 모드 — 아래 deviceIds 가 비어 있을 때만 쓰인다). 기본 배치 전제:
  # GPU0 = paddleocr-vl + harness bge-m3(이 차트 밖) + paddleocr-lines(드라이버만)가 한 장을
  # 나눠 쓴다(device plugin time-slicing 필요). GPU1 = vllm-vlm 전용.
  gpuCount: 1
  # 쓸 GPU 카드 번호(쉼표 구분, 노드의 물리 번호). **비우면(기본) device plugin 이 유휴 카드를
  # 골라 위 gpuCount 장을 준다.** 값을 넣으면 device plugin 을 우회해 그 번호의 카드를 직접
  # 붙인다(장수는 개수로 정해지고 gpuCount 는 쓰이지 않는다) — 이때는 gpu.nodeSelector 로 노드를
  # 직접 지정해야 한다(비우면 렌더링이 멈춘다).
  deviceIds: ""
  # device plugin 모드에서 requests/limits 에 쓸 자원 이름. MIG 로 나뉜 카드에서는 vlm-server(실제
  # 추론)에 nvidia.com/mig-4g.71gb 처럼 큰 조각을 준다 — api 는 apiGpuResource 로 따로 준다.
  gpuResource: nvidia.com/gpu
  # api(paddlex serve) 전용 자원 이름. **비우면(기본) 위 gpuResource 를 그대로 쓴다.** api 는
  # layout 검출 등 vlm-server 보다 가벼운 CV 모델만 돌리므로(아래 api 컨테이너 주석 참고) MIG
  # 에서는 더 작은 조각(예: nvidia.com/mig-1g.18gb)을 줄 수 있다.
  apiGpuResource: ""
  # GPU 전체 메모리 대비 비율. compose 기본값 0.6 은 L4 24GB(약 14.4GB) 기준이다. 고객 환경(L40S
  # 48GB)에서는 같은 절대량이면 0.3 이지만, harness bge-m3·paddleocr-lines 와 카드를 나눠 쓰므로
  # 여유를 더 둬 0.25 를 기본값으로 한다 — 실측 후 조정한다(미확정, 아래 uncertain 참고). 카드를
  # 나눠 쓸 때는(time-slicing 포함) GPU 메모리가 격리되지 않으므로 함께 쓰는 컴포넌트의 비율
  # 합이 카드 하나에 들어와야 한다.
  gpuMemoryUtilization: 0.25
  maxNumSeqs: 32
  maxNumBatchedTokens: 16384
  # paddlex --serve(api) 는 한 파드가 요청을 하나씩 처리한다(layout 약 2.2초 → 0.45 req/s). 여러 개를 띄우면 같은
  # vlm-server 를 나눠 쓰며 병렬로 처리한다 — H200 실측 3개 0.77 req/s, 폴백 처리량 0.65 → 1.06 docs/s. 파드당 GPU 약 1.4GB.
  apiReplicas: 1
  # PaddleOCR-VL API 요청 타임아웃(초). backend PADDLEOCR_TIMEOUT 과 값을 맞춘다.
  timeout: 600
  resources:
    vlmServer:
      requests: { cpu: "1", memory: 4Gi, ephemeral-storage: 1Gi }
      limits:   { memory: 16Gi, ephemeral-storage: 30Gi }   # 컨테이너 쓰기층(~/.paddlex·vLLM 컴파일 캐시·로그)
    # api 는 VLM 추론은 vlm-server 에 맡기지만, 그 안의 문서 방향·왜곡 보정·레이아웃 검출
    # (PP-DocLayoutV3 등)은 자체적으로 GPU 로 돈다 — pipeline_config_vllm.yaml 에 --device 지정이
    # 없어(paddleocr-lines 의 --device cpu 와 달리) CPU 전용 옵션이 아직 없다. 그대로 GPU 자원을
    # 요청한다(위 apiGpuResource 로 vlm-server 와 다른 MIG 조각을 줄 수 있다).
    api:
      requests: { cpu: 500m, memory: 1Gi, ephemeral-storage: 256Mi }
      limits:   { memory: 4Gi, ephemeral-storage: 20Gi }

# ── PP-OCRv5 줄 좌표 파서 (CPU 추론, GPU 드라이버만 주입) ───────────────
paddleocrLines:
  enabled: false
  # cpu(기본) | gpu:0 등 — paddlex --serve --device 값. CPU 를 써도 이미지가 paddlepaddle-gpu 라
  # libcuda 로딩에 GPU 가시성이 필요하다(없으면 ImportError, compose 주석과 동일 이유).
  device: cpu
  # 드라이버만 얹을 GPU 장수(device plugin 모드 — 아래 deviceIds 가 비어 있을 때만 쓰인다).
  gpuCount: 1
  # GPU0 에 드라이버만 얹는다(연산은 하지 않는다) — paddleocrVl 과 같은 카드를 공유하는 예.
  # **비우면(기본) device plugin 이 위 gpuCount 장을 준다.** 값을 넣으면 device plugin 을
  # 우회해 그 번호의 카드를 직접 붙인다.
  deviceIds: ""
  # device plugin 모드에서 requests/limits 에 쓸 자원 이름 — 연산은 CPU 지만 libcuda 로딩용으로
  # 카드(또는 MIG 조각) 하나를 여전히 잡아야 한다(위 device 주석 참고).
  gpuResource: nvidia.com/gpu
  resources:
    requests: { cpu: "1", memory: 2Gi, ephemeral-storage: 256Mi }
    limits:   { memory: 4Gi, ephemeral-storage: 10Gi }   # 모델 캐시는 PVC/hostPath 라 세지 않는다

# ── AI(VLM) 엔드포인트 ──────────────────────────────────────────────────
# vllmVlm(아래, in-cluster vLLM)을 켜지 않고 외부 OpenAI 호환 VLM(별도 호스팅 vLLM, OpenRouter 등)을
# 가리킬 때만 채운다. AI_BASE_URL/AI_VLM_MODEL 은 이 값과 vllmVlm 중 한 곳에서만 정해진다(계산은
# templates/_helpers.tpl 의 dft.aiBaseUrl/dft.aiVlmModel 한 곳뿐) — vllmVlm.enabled=true 면 이 값 대신
# in-cluster 주소를 쓰고, 둘 다 채우면 어느 쪽인지 헷갈리는 대신 렌더링이 멈춘다. 키는 auth.aiApiKey
# (AI_API_KEY)를 그대로 쓴다 — 우산 차트의 docraft.auth.aiApiKey → 공유 Secret 계약과 같다.
ai:
  baseUrl: ""
  model: ""

# ── vLLM VLM — Qwen3.8-27B (GPU) ───────────────────────────────────────
vllmVlm:
  enabled: false
  # backend AI_VLM_MODEL 로 그대로 전달되는 served 이름.
  servedModelName: "qwen3.8-27b"   # 설치 묶음(charts/mlife-ocr)과 같은 이름(2026-10-14 27B 통일, 이전 qwen3-vl-32b-instruct)
  # models.volume.hostPath(또는 existingClaim) 아래 서브디렉터리 — 반입 번들이 채운다.
  # 기본은 FP8 양자화판(미확정 실제 배포 모델 ID, 아래 uncertain 참고).
  modelDir: "Qwen3.8-27B-FP8"
  # 쓸 GPU 장수. --tensor-parallel-size 에 그대로 들어간다(device plugin 모드 — 아래 deviceIds
  # 가 비어 있을 때만 쓰인다). BF16 + 텐서 병렬로 바꾸려면 modelDir 을 BF16 가중치로, 이 값을
  # 2로(또는 deviceIds 를 "1,2" 처럼 두 장으로) 바꾼다(gpuMemoryUtilization·maxModelLen 은
  # 그대로 두거나 같이 조정).
  gpuCount: 1
  # 카드를 나누는 방식. tensor(기본) = 위 장수로 모델 한 벌을 나눠 띄운다(--tensor-parallel-size).
  # data = 파드 하나에서 카드마다 모델을 한 벌씩 띄우고 vLLM 이 요청을 나눠 준다(--data-parallel-size).
  # replicas = 카드마다 파드를 하나씩 띄우고(파드당 1장) Envoy 라우터(router)가 처리 중 요청이 적은 파드로 나눠 준다.
  #   한 벌이 멈추거나 재시작해도 나머지 벌은 계속 받는다 — 운영 기본(2026-10-15 운영계 vLLM 지연 뒤 결정).
  # 한 장에 들어가는 모델(예: Qwen3.8-27B FP8 은 L40S 한 장)이면 data·replicas 가 처리량이 높다 — 벌끼리 통신하지 않는다.
  # --max-num-seqs·resources 는 벌(replicas 는 파드)마다 적용된다. 주소(Service -vllm-vlm)는 세 방식 모두 하나다.
  parallel: tensor
  # 쓸 GPU 카드 번호(쉼표 구분). **비우면(기본) device plugin 이 위 gpuCount 장을 준다.** 값을
  # 넣으면 device plugin 을 우회해 그 번호의 카드를 직접 붙인다 — 장수는 개수로 정해지고
  # gpuCount 는 쓰이지 않는다(harness-v2 embedding 모델과 같은 패턴).
  deviceIds: ""
  # device plugin 모드에서 requests/limits 에 쓸 자원 이름. MIG 카드에서는 vLLM 텐서 병렬용으로
  # 큰 조각(예: nvidia.com/mig-4g.71gb)을 준다 — gpuCount(텐서 병렬 장수)만큼 같은 이름으로
  # 여러 조각을 요청하므로, 노드에 그 크기의 조각이 gpuCount 개 있어야 한다.
  gpuResource: nvidia.com/gpu
  # GPU 전체 메모리 대비 비율. L40S 48GB에 FP8 27B(가중치 약 29GB) + KV cache 여유.
  gpuMemoryUtilization: 0.90
  maxModelLen: 32768
  # 비우면 체크포인트 기본 dtype(FP8) 그대로. BF16 가중치로 바꿀 때 "bfloat16".
  dtype: ""
  # Qwen3-VL 계열은 커스텀 모델 코드가 필요하다.
  extraArgs:
    - --trust-remote-code
  # ephemeral-storage: 가중치는 hostPath/PVC 라 세지 않는다. 컨테이너 쓰기층(HOME 의 ~/.cache vllm·torch compile·triton 캐시, /tmp)과 로그가
  # limits 로 잡힌다 — 컴파일 캐시가 수 GiB 가 될 수 있어 limits 는 넉넉히 둔다(너무 작으면 kubelet 이 파드를 퇴거시킨다).
  resources:
    requests: { cpu: "2", memory: 16Gi, ephemeral-storage: 1Gi }
    limits:   { memory: 32Gi, ephemeral-storage: 30Gi }
  # 멈춤 감지(초, 0 이면 /health 만 본다) — 받은 요청이 있는데 처리한 토큰 수가 이 시간 동안 그대로면 그 파드를 재시작한다.
  # 바쁘기만 한 엔진은 토큰이 늘어 걸리지 않는다. 판정까지 최대 이 값 + 90초(검사 30초 × 3회).
  stallSeconds: 180
  # parallel: replicas 의 Envoy 라우터.
  router:
    # 라우터는 상태가 없다 — 2 이상이면 한 파드가 죽어도 vLLM 호출이 이어진다(least_request 는 라우터마다 자기 연결 기준).
    replicas: 1
    # 응답 바이트가 이만큼 오지 않으면 연결을 끊는다(비스트리밍 응답은 다 만들 때까지 조용하다 — backend AI_TIMEOUT 보다 길게).
    idleTimeoutSeconds: 900
    resources:
      requests: { cpu: 200m, memory: 64Mi, ephemeral-storage: 64Mi }
      limits:   { memory: 512Mi, ephemeral-storage: 1Gi }   # 접근 로그(stdout)도 노드 디스크를 쓴다

# 모든 파드에 공통으로 붙일 스케줄링 설정(gpu.* 와 별도로, GPU 파드에도 함께 병합된다)
nodeSelector: {}
tolerations: []

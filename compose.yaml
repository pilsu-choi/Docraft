name: docraft

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.6-pg16}
    environment:
      POSTGRES_DB: docraft
      POSTGRES_USER: docraft
      POSTGRES_PASSWORD: docraft
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - docraft_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docraft -d docraft"]
      interval: 5s
      timeout: 3s
      retries: 12
    shm_size: 128mb

  # 백엔드 API. `docker compose --profile app up -d --build`로 postgres와 함께 실행한다.
  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
    # 로컬 실행과 공유하는 ./data가 root 소유가 되지 않도록 호스트 사용자로 실행한다.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    env_file: &backend-env-file
      - path: .env
        required: false
    environment: &backend-env
      DATABASE_URL: postgresql://docraft:docraft@postgres:5432/docraft
      DOCRAFT_DATA_DIR: /data
      PADDLEOCR_BASE_URL: http://paddleocr-vl-api:8080
      PADDLEOCR_LINES_URL: http://paddleocr-lines-api:8080
      QUEUE_BACKEND: ${QUEUE_BACKEND:-inline}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      LOG_FILE: ""
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    volumes: &master-volumes
      - ./data:/data
      # MASTER_SOURCE_DIR(.env)이 가리키는 경로. 비어 있으면 backend/master.py가 조용히 건너뛴다.
      - ${MASTER_SOURCE_HOST_DIR:-./data/master-source}:/master:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # 작업 큐(선택). `QUEUE_BACKEND=celery docker compose --profile app --profile queue up -d --build`.
  # 공용 redis/Celery 인프라를 쓰면 이 redis는 띄우지 말고(.env의 CELERY_BROKER_URL만 지정)
  # `docker compose up -d worker`처럼 worker만 추가한다. QUEUE_NAME으로 큐·태스크·키가 분리된다.
  redis:
    profiles: [queue]
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    profiles: [queue]
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    command: ["python", "-m", "backend.worker"]
    env_file: *backend-env-file
    environment: *backend-env
    volumes: *master-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # 프론트엔드(nginx). `docker compose --profile app up -d --build`로 backend와 함께 실행한다.
  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy

  # PaddleOCR-VL 전체 layout pipeline(NVIDIA GPU). `docker compose --profile ocr up -d`로 실행한다.
  paddleocr-vlm-server:
    profiles: [ocr]
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-vllm-server:${PADDLEOCR_IMAGE_TAG:-latest-nvidia-gpu-offline}
    command: paddleocr genai_server --model_name ${PADDLEOCR_MODEL:-PaddleOCR-VL-1.6-0.9B} --host 0.0.0.0 --port 8080 --backend vllm --backend_config /home/paddleocr/vlm_server_config.yaml
    volumes:
      - ./deploy/paddleocr/vllm_config.yaml:/home/paddleocr/vlm_server_config.yaml:ro
    deploy: &gpu
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PADDLEOCR_GPU:-0}"]
              capabilities: [gpu]
    shm_size: 4gb
    user: root
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      start_period: 300s

  paddleocr-vl-api:
    profiles: [ocr]
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:${PADDLEOCR_IMAGE_TAG:-latest-nvidia-gpu-offline}
    # 이미지 기본 pipeline 설정의 VL 모델명을 PADDLEOCR_MODEL로 맞춘 뒤 서빙한다.
    command: ["/bin/bash", "-c", "sed 's/model_name: PaddleOCR-VL.*/model_name: ${PADDLEOCR_MODEL:-PaddleOCR-VL-1.6-0.9B}/' /home/paddleocr/pipeline_config_vllm.yaml > /tmp/pipeline.yaml && exec paddlex --serve --pipeline /tmp/pipeline.yaml"]
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PADDLEOCR_PORT:-8080}:8080"
    deploy: *gpu
    shm_size: 4gb
    user: root
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      start_period: 120s

  # 줄 좌표 전용 PP-OCRv5 파이프라인. 근거 상자를 블록이 아닌 줄 단위로 그리기 위해 쓴다.
  # CPU 추론이지만 이미지가 paddlepaddle-gpu라 libcuda 로딩에 GPU 예약이 필요하다(없으면 ImportError).
  # 모델은 첫 기동 때 $HOME/.paddlex 아래로 자동 내려받는다(이미지 HOME=/home/paddleocr).
  paddleocr-lines-api:
    profiles: [ocr]
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:${PADDLEOCR_IMAGE_TAG:-latest-nvidia-gpu-offline}
    command: ["paddlex", "--serve", "--pipeline", "/home/paddleocr/ocr_lines.yaml", "--device", "cpu"]
    volumes:
      - ./deploy/paddleocr/ocr_lines.yaml:/home/paddleocr/ocr_lines.yaml:ro
      - docraft_paddlex_models:/home/paddleocr/.paddlex
    ports:
      - "127.0.0.1:${PADDLEOCR_LINES_PORT:-8081}:8080"
    deploy: *gpu
    user: root
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      start_period: 300s

volumes:
  docraft_postgres:
  docraft_paddlex_models:
